# O binário de teste da Fase 0 do Tauri, para as duas plataformas do balcão.
#
# 🧪 **Não é instalador.** É o executável solto, para copiar para uma máquina
#    Windows e uma Linux do balcão e responder P1–P9 com
#    `app-tauri --diagnostico` (recordarfotos-e-commerce/docs/DESKTOP_TAURI.md §8).
#    O empacotamento de verdade é a Fase 4.
#
# ⚠️ Só por disparo manual: não há o que publicar, e o artefato some em 7 dias.
name: Fase 0 do Tauri

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  binario:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 pelo mesmo motivo dos instaladores: a glibc de quem compila é
          # o piso do binário.
          - nome: Linux x86_64
            runner: ubuntu-22.04
            sistema: linux
            alvo: x86_64-unknown-linux-gnu
            executavel: app-tauri
          # `-gnu` pelo mesmo motivo dos instaladores: o `rsraw-sys` recusa MSVC.
          - nome: Windows x86_64
            runner: windows-latest
            sistema: windows
            alvo: x86_64-pc-windows-gnu
            executavel: app-tauri.exe

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.sistema == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.alvo }}

      - name: O g++ do MinGW
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          if (-not (Get-Command g++ -EA SilentlyContinue)) {
            if (Test-Path "$mingw\g++.exe") { Add-Content $env:GITHUB_PATH $mingw }
            else { Write-Error "g++ do MinGW nao encontrado — o rsraw-sys nao compila sem ele"; exit 1 }
          }

      - uses: Swatinem/rust-cache@v2
        with:
          key: fase0-${{ matrix.sistema }}

      - name: Testes
        run: cargo test -p app-tauri --target ${{ matrix.alvo }}

      - name: Binário
        run: cargo build --release -p app-tauri --bin app-tauri --target ${{ matrix.alvo }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-tauri-fase0-${{ matrix.sistema }}
          path: target/${{ matrix.alvo }}/release/${{ matrix.executavel }}
          retention-days: 7
