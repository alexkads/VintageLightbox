name: CI

# `dev`, e não `develop`: o branch chamado `develop` **nunca existiu** neste
# repositório — o trabalho acontece em `dev`. Enquanto o gatilho apontou para um
# nome inexistente, o CI só rodava em `main`, ou seja, depois de o trabalho já
# estar mesclado. Um CI que não dispara onde se trabalha não é um CI verde: é um
# CI mudo.
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 🚨 Sem `ubuntu-latest`, decidido na migração para GPUI
        # (docs/10-MIGRACAO-GPUI.md §1).
        #
        # O `gpui 0.2.2` publicado no crates.io ainda resolve `blade-graphics`
        # no Linux — a troca para wgpu (PR #46758 do Zed, merge em fev/2026)
        # não chegou ao crate. Manter o Ubuntu na matriz passaria a compilar o
        # caminho que o próprio Zed chamou de bagunça, para uma plataforma que
        # o produto **não declara**: o README fala macOS e Windows, e o Linux
        # estava aqui por inércia.
        #
        # ⚠️ Isto não é "o Linux não funciona" — é "ninguém confere o Linux".
        # Voltar a suportá-lo é acrescentar a linha de volta e ver o que quebra.
        os: [macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # 🚨 O GPUI compila os shaders Metal em **tempo de build**, e o runner não
      # traz a toolchain. Sem este passo o build morre com
      # `cannot execute tool 'metal' due to missing Metal Toolchain`.
      #
      # O wgpu do egui compila shader em *runtime* e nunca exigiu isto — então
      # é dependência nova, que entra antes do crate que a exige para o
      # primeiro CI da fase 1 já nascer verde.
      - name: Install Metal Toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run tests (release mode)
        run: cargo test --workspace --release --verbose

      # O clippy do `ui-gpui` roda **aqui**, e não no job `clippy`: aquele fica
      # no Ubuntu, e compilar este crate lá puxaria o Blade — o caminho que a
      # matriz acima acabou de deixar de conferir. Só no macOS, porque o Windows
      # do GPUI ainda é alpha no Zed e não vale travar o CI por ele hoje.
      #
      # ⚠️ Ele nasceu limpo, e é muito mais barato mantê-lo assim do que
      # limpá-lo depois — foi o que custou 125 avisos nas camadas internas.
      - name: Clippy (ui-gpui)
        if: runner.os == 'macOS'
        run: cargo clippy -p ui-gpui --all-targets --all-features -- -D warnings

  # Formatação não compila nada, então continua no runner mais barato.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy sobre as **quatro camadas internas**, com `-D warnings`.
  #
  # 🚨 O job já cobrou o workspace inteiro e **nunca esteve verde**: `crates/ui`
  # tinha centenas de avisos, e como o gatilho apontava para um branch
  # inexistente ninguém via. Arrumá-los seria trabalho num crate que a fase 5
  # apagava — e ela apagou, em 17/ago/2026.
  #
  # ⚠️ **E o workspace inteiro passa agora**, conferido no mesmo dia
  # (`cargo clippy --workspace --all-targets -- -D warnings`, limpo). Este job
  # continua nas quatro camadas de propósito: elas não tocam a GPU, e é por isso
  # que ele roda no runner barato, sem Metal Toolchain. O `ui-gpui` tem o job
  # dele no macOS, onde a GPU existe.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run clippy
        run: >
          cargo clippy
          -p domain -p use-cases -p adapters -p infrastructure -p revelacao-core
          --all-targets --all-features -- -D warnings

  # A cobertura fica no Ubuntu, mas **só sobre as quatro camadas internas** —
  # que não têm GPU, não têm janela e são onde a cobertura diz alguma coisa.
  #
  # É o que permite manter o runner barato sem compilar `ui-gpui`. Medir
  # cobertura de interface por tarpaulin nunca deu número útil aqui: quem cobre a
  # UI são os testes de UI.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: >
          cargo tarpaulin
          -p domain -p use-cases -p adapters -p infrastructure -p revelacao-core
          --out Xml --timeout 300

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Mesma matriz do `test`, e pelo mesmo motivo.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Metal Toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: cargo build --workspace --release --verbose

      - name: Check binary size (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -lh target/release/

      - name: Check binary size (Windows)
        if: runner.os == 'Windows'
        run: |
          dir target\release\
