<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f38"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <filter id="brilho" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- corpo -->
  <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#fundo)"/>
  <rect x="72" y="72" width="880" height="880" rx="196" fill="none" stroke="#3a3f4a" stroke-width="8"/>

  <!-- o brilho da mesa de luz -->
  <rect x="212" y="300" width="600" height="424" rx="28" fill="#ffcf7a" opacity="0.55" filter="url(#brilho)"/>

  <!-- a mesa de luz -->
  <rect x="212" y="300" width="600" height="424" rx="24" fill="url(#mesa)"/>

  <!-- a tira de filme sobre a mesa -->
  <g>
    <rect x="272" y="356" width="480" height="312" rx="10" fill="#1b1e24"/>
    <!-- perfurações -->
    <g fill="#f2efe6">
      <rect x="296" y="378" width="34" height="26" rx="6"/>
      <rect x="360" y="378" width="34" height="26" rx="6"/>
      <rect x="424" y="378" width="34" height="26" rx="6"/>
      <rect x="488" y="378" width="34" height="26" rx="6"/>
      <rect x="552" y="378" width="34" height="26" rx="6"/>
      <rect x="616" y="378" width="34" height="26" rx="6"/>
      <rect x="680" y="378" width="34" height="26" rx="6"/>
      <rect x="296" y="620" width="34" height="26" rx="6"/>
      <rect x="360" y="620" width="34" height="26" rx="6"/>
      <rect x="424" y="620" width="34" height="26" rx="6"/>
      <rect x="488" y="620" width="34" height="26" rx="6"/>
      <rect x="552" y="620" width="34" height="26" rx="6"/>
      <rect x="616" y="620" width="34" height="26" rx="6"/>
      <rect x="680" y="620" width="34" height="26" rx="6"/>
    </g>
    <!-- os três quadros -->
    <rect x="298" y="428" width="132" height="168" rx="6" fill="#c96f3f"/>
    <rect x="446" y="428" width="132" height="168" rx="6" fill="#8fae7a"/>
    <rect x="594" y="428" width="132" height="168" rx="6" fill="#5d7fa8"/>
  </g>
</svg>
