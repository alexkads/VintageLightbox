[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/use-cases",
    "crates/adapters",
    "crates/infrastructure",
    # O motor de revelação sem nada em volta (2026-09-04): o que o navegador
    # precisa e o `infrastructure` não consegue dar, porque puxa sqlx, reqwest e
    # LibRaw — nada disso compila para wasm32.
    "crates/revelacao-core",
    # O mesmo motor compilado para o navegador (wasm-bindgen + wgpu). É o que o
    # `scripts/construir-web.sh` entrega ao `recordarfotos-e-commerce`.
    "crates/revelacao-web",
    # A biblioteca de fotos sem tela (2026-09-05): a geometria da grade, a
    # seleção, o recorte da barra e a política das miniaturas. Existiam três
    # cópias das mesmas contas — as duas grades do site e a Biblioteca daqui —,
    # e elas já tinham divergido.
    "crates/biblioteca-core",
    # A mesma biblioteca desenhada no navegador (wgpu + wasm-bindgen), entregue
    # em `frontend/public/biblioteca/` pelo `scripts/construir-biblioteca.sh`.
    "crates/biblioteca-web",
    # A interface, em GPUI. O `crates/ui` (egui) saiu daqui em 17/ago/2026, com a
    # lista de paridade zerada (docs/PARIDADE-UI.md) — é a fase 5 do plano.
    #
    # 🔑 **O que ele era e deixou de ser**: o rollback e a referência de
    # paridade. O rollback agora é `git revert` do commit que o removeu, que é
    # um comando e traz os 21.352 LOC de volta inteiros; a referência de
    # paridade virou documento, e o código continua no histórico.
    "crates/ui-gpui",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
authors = ["VintageLightbox Team"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Testing tools
mockall = "0.12"
proptest = "1.4"
fake = { version = "2.9", features = ["derive"] }
tempfile = "3.8"

# Snapshot testing
insta = { version = "1.34", features = ["yaml"] }

# Async runtime (for future use)
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Parallelism
rayon = "1.8"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 0
debug = true

# 🚨 **As dependências saem otimizadas mesmo em `dev`, e isto não é detalhe.**
#
# `opt-level = 0` vale para o código deste repositório — que é o que se depura —,
# mas em `dev` ele também valia para o `image`, o `jpeg-decoder` e o `rusqlite`,
# que são quem faz o trabalho pesado. Medido em 8/set/2026 (`medir-revelacao`,
# catálogo real): decodificar um preview de 2560px custava **414 ms** e o
# `to_rgba8` dele **768 ms** — contra 24 ms e 4 ms em `release`. Uma seta na
# tira custava quase um segundo, e o CLAUDE.md registra que isso já foi
# confundido com "o framework é lento" duas vezes.
#
# 🔑 **Elas compilam uma vez.** Otimizar dependência não custa tempo de
# recompilação no dia a dia: o que se mexe é o código daqui, que continua em
# `opt-level = 0`, com nome de função e linha no backtrace.
[profile.dev.package."*"]
opt-level = 3

# 🚨 **E os laços de pixel deste repositório também.** `opt-level = 0` num laço
# que percorre 4,4 milhões de pixels não é "sem otimização", é 30× mais lento:
# o histograma da Revelação custava 211 ms em `dev` contra 0,3 ms em `release`,
# e o `para_gpui` 100 ms contra 4 ms — por quadro, enquanto um slider anda.
#
# 🔑 **`opt-level = 1` mantém o que se depura**: nome de função, número de linha
# e backtrace continuam lá; o que sai é a ausência de vetorização e o excesso de
# cópias que o nível zero deixa. É o meio-termo que faz `cargo run` sem
# `--release` ser utilizável num app que trabalha com imagem — e o CLAUDE.md
# registra que a lentidão do perfil já foi confundida com "o framework é lento"
# duas vezes.
[profile.dev.package.ui-gpui]
opt-level = 2

[profile.dev.package.revelacao-core]
opt-level = 2

[profile.dev.package.infrastructure]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

# O perfil do `.wasm`: tamanho antes de velocidade. O `release` acima é o do
# desktop e não se toca — `opt-level = 3` num binário que o navegador baixa a
# cada primeira abertura custaria o dobro de bytes por pouco ganho.
[profile.release-web]
inherits = "release"
opt-level = "z"
panic = "abort"
