[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/use-cases",
    "crates/adapters",
    "crates/infrastructure",
    "crates/ui",
    # A interface em GPUI, construída ao lado da de egui — os dois rodam até a
    # fase 5 (docs/10-MIGRACAO-GPUI.md §7.2). `crates/ui` é o rollback e a
    # referência de paridade; tirá-lo antes da hora torna abandonar a migração
    # caro, e é justamente o modo de falha mais provável do plano.
    "crates/ui-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VintageLightbox Team"]
license = "MIT"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Testing tools
mockall = "0.12"
proptest = "1.4"
fake = { version = "2.9", features = ["derive"] }
tempfile = "3.8"

# Snapshot testing
insta = { version = "1.34", features = ["yaml"] }

# Async runtime (for future use)
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Parallelism
rayon = "1.8"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1
