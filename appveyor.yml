# AppVeyor — roda o INSTALADOR do balcão, no Windows e no Linux, a cada push.
#
# 🔑 **Por que existe (24/set/2026).** O GitHub Actions está travado por
#    cobrança desde 17/set, e nem antes ele conferia o que importa: o `ci.yml`
#    tirou o Linux da matriz e testava `cargo test`, não o que o balcão roda.
#    Os balcões são Windows e Linux e instalam por
#    `scripts/instalar-vintagelightbox-gpui.cmd`, que baixa o branch e compila
#    na máquina. Então é **ele** que roda aqui, do jeito que roda lá: se o
#    AppVeyor ficou verde, o próximo balcão que repetir a instalação compila.
#
# ⚠️ **O que ele compila é o branch no GitHub, e não este checkout.** O
#    instalador baixa `archive/refs/heads/<branch>`, como no balcão. Dois pushes
#    seguidos podem fazer a primeira build compilar o código da segunda.
#
# ⚠️ **O `Cargo.lock` não é versionado** (`.gitignore`): cada instalação
#    resolve as dependências do dia. Uma build vermelha sem commit novo
#    costuma ser uma dependência que publicou versão quebrada. É o que o
#    balcão pegaria no dia seguinte, então é aviso de verdade.
#
# 🚨 **Nada de segredo aqui.** Esta build não assina nem publica: a chave
#    minisign e o wrangler do R2 ficam na máquina de quem lança
#    (empacotamento/README.md). Um CI de terceiro com a chave privada poderia
#    mandar "atualização" a todo balcão.

version: '{build}-{branch}'
branches:
  only:
    - dev
    - main
skip_tags: true
clone_depth: 1

environment:
  matrix:
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204

# Uma falha num sistema não esconde o outro.
matrix:
  fast_finish: false

for:
  # ── Windows ────────────────────────────────────────────────────────────────
  #
  # O `.cmd` de dois cliques baixa a versão mais nova do próprio script do
  # `raw.githubusercontent.com/.../dev`, que tem cache de minutos, e termina
  # num `pause`. Aqui o bloco PowerShell é extraído **deste checkout** do mesmo
  # jeito que o `.cmd` o extrai, e roda como lá: num `powershell.exe` à parte.
  #
  # 🐛 A 1ª build (24/set) morreu no `info: profile set to minimal` do
  #    rustup-init: com a saída redirecionada, o PS 5.1 transforma stderr de
  #    programa em erro, e o "Stop" do instalador derrubava tudo. Era defeito do
  #    instalador, não do CI (`instalar.cmd > log.txt` morria igual); o
  #    `Correr` agora decide a falha só pelo código de saída.
  - matrix:
      only:
        - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    environment:
      VLB_DESTINO: C:\vlb-instalado
    build_script:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; $env:VLB_VERSAO=$env:APPVEYOR_REPO_BRANCH; try { $t=[IO.File]::ReadAllText('scripts\instalar-vintagelightbox-gpui.cmd'); $n=[char]10; $i=$t.IndexOf($n+'#==POWERSHELL=='); $f=$t.IndexOf($n+'#==FIM-POWERSHELL==',$i); if ($i -lt 0 -or $f -le $i) { throw 'instalador sem o bloco PowerShell' }; Invoke-Expression $t.Substring($i, $f-$i) } catch { Write-Host ('X ' + $_) -ForegroundColor Red; exit 1 }"
      - cmd: if not exist C:\vlb-instalado\VintageLightbox-GPUI.exe (echo o instalador terminou sem deixar o executavel & exit 1)
      - cmd: dir C:\vlb-instalado

  # ── Linux ──────────────────────────────────────────────────────────────────
  #
  # Exatamente a linha do balcão, com o arquivo deste checkout no lugar do
  # `curl`. O usuário `appveyor` tem `sudo` sem senha, que é o que o
  # instalador usa para os pacotes do apt.
  - matrix:
      only:
        - APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2204
    build_script:
      - sh: sh scripts/instalar-vintagelightbox-gpui.cmd --versao "$APPVEYOR_REPO_BRANCH" --destino "$HOME/vlb-instalado"
      - sh: test -x "$HOME/vlb-instalado/bin/vintagelightbox-gpui" && ls -l "$HOME/vlb-instalado/bin/vintagelightbox-gpui"
    on_failure:
      # O instalador grava o registro completo (retrato da máquina + saída do
      # cargo); é o mesmo arquivo que o balcão mandaria.
      - sh: for f in $HOME/.vintagelightbox/registros/instalacao-*.log; do [ -f "$f" ] && appveyor PushArtifact "$f"; done

test: off
