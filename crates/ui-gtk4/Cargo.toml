# ⚠️ EXPERIMENTAL: UI GTK4/Relm4 em desenvolvimento ativo
# Esta é uma implementação experimental da interface de usuário.
# A UI egui (crates/ui/) é a versão funcional atual.
# Progresso: ~13% (Fases 1-2 completas de 7 planejadas)
# Veja crates/ui-gtk4/README.md para detalhes

[package]
name = "ui-gtk4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vintage-lightbox-gtk"
path = "src/main.rs"

[dependencies]
# Core relm4/GTK4
relm4 = { version = "0.9", features = ["macros", "gnome_46"] }
relm4-components = "0.9"

# GTK4 extras
gtk4 = { version = "0.9", features = ["v4_14"] }
gdk4 = "0.9"
gdk-pixbuf = "0.20"
gio = "0.20"
glib = "0.20"
cairo-rs = { version = "0.20", features = ["png"] }

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Shared crates (Clean Architecture layers)
adapters = { path = "../adapters" }
use-cases = { path = "../use-cases" }
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure" }

# Image handling
image = "0.24"

# Utilities
parking_lot = "0.12"
rayon.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
dotenv = "0.15"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile.workspace = true
