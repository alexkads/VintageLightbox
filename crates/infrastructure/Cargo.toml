[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain" }
use-cases = { path = "../use-cases" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
async-trait.workspace = true
kamadak-exif = "0.6"
image = "0.25"
rawloader = "0.37.1"  # Mantido para fallback se rsraw falhar
directories = "6.0.0"
sha2 = "0.10"
rusqlite = { version = "0.30.0", features = ["bundled"] }
rsraw = "0.1"  # LibRaw binding - demosaic/white balance/color correction integrados
uuid.workspace = true
sysinfo = "0.36.1"

# O motor de revelação (`gpu_adjustments.rs`), que veio do `ui-gpui` em
# 17/ago/2026 para que a exportação atravessasse o mesmo shader que a tela.
# wgpu é quem compila o WGSL — versão diferente é compilador diferente para o
# mesmo shader, e o critério da fase 2 era igualdade de pixel.
wgpu = "23.0"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"
# O cache de recursos por tamanho de imagem.
lru = "0.16.2"

# O cliente HTTP do pós-venda (`pos_venda/http.rs`) — o único lugar do app que
# fala com a rede. `native-tls`, e não `rustls`: o `sqlx` acima já traz a pilha
# TLS do sistema, e uma segunda ao lado dela seria compilar o mesmo trabalho
# duas vezes.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }

[dev-dependencies]
tempfile.workspace = true
mockall.workspace = true
# Um servidor HTTP de verdade para o cliente do pós-venda: o que se prova ali é
# o multipart e o cabeçalho — coisas que nenhum mock do `reqwest` alcança.
wiremock = "0.6"
