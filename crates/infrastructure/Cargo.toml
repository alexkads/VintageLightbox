[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain" }
use-cases = { path = "../use-cases" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
async-trait.workspace = true
kamadak-exif = "0.6"
image = "0.25"
rawloader = "0.37.1"  # Mantido para fallback se rsraw falhar
directories = "6.0.0"
sha2 = "0.10"
rusqlite = { version = "0.30.0", features = ["bundled"] }
rsraw = "0.1"  # LibRaw binding - demosaic/white balance/color correction integrados
uuid.workspace = true
sysinfo = "0.36.1"

# A autorização pelo navegador (`pos_venda/autorizacao.rs`) e o chaveiro do
# sistema (`pos_venda/cofre.rs`). O `keyring` é o Keychain no macOS, o
# Credential Manager no Windows e o Secret Service no Linux — a alternativa era
# um arquivo com o refresh token de quinze dias dentro.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
base64 = "0.22"

# Quem leva o operador ao navegador na autorização (`abrir_no_navegador`).
# 🚨 A feature `shellexecute-on-windows` não é enfeite: sem ela o `open` cai no
# `explorer.exe`, e o que o balcão via era o **Explorador de Arquivos** no lugar
# do navegador. Com ela, o caminho no Windows é a `ShellExecuteExW` — a mesma do
# duplo clique. A feature também vale para o `tauri-plugin-opener`, que usa este
# mesmo crate: as features se unificam no workspace.
open = { version = "5", features = ["shellexecute-on-windows"] }

# O motor de revelação: `Ajustes`, o WGSL, `Motor`, o enquadramento e o JPEG.
# Saiu daqui para um crate próprio em 2026-09-04, para compilar também no
# navegador; o que fica aqui é a leitura da entidade (`ajustes_da_entidade`,
# `corte_da_entidade`), que é a única parte que conhece o `domain`.
revelacao-core = { path = "../revelacao-core" }
# O cache de prévias (`cache/preview_manager.rs`).
lru = "0.16.2"

# O cliente HTTP do pós-venda (`pos_venda/http.rs`) — o único lugar do app que
# fala com a rede. `native-tls`, e não `rustls`: o `sqlx` acima já traz a pilha
# TLS do sistema, e uma segunda ao lado dela seria compilar o mesmo trabalho
# duas vezes.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "stream"] }
# 🔑 `stream` + `futures`: o envio do acervo (`/dashboard/backup`) precisa
# relatar quantos bytes já saíram, e isso só existe com o corpo entregue como
# fluxo. Sem eles a barra saltaria de 0 a 100 por arquivo.
futures.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
tempfile.workspace = true
# Só para ler a etiqueta de rotação da LibRaw em `tests/raw_em_retrato.rs`.
rsraw-sys = "0.1"
mockall.workspace = true
# Um servidor HTTP de verdade para o cliente do pós-venda: o que se prova ali é
# o multipart e o cabeçalho — coisas que nenhum mock do `reqwest` alcança.
wiremock = "0.6"
